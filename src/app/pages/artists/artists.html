<main class="artists">
    <header class="artists__header">
        <app-search [searchTerm]="searchText" (searchChange)="onSearch($event)"/>
    </header>
    <section class="artists__content">
        @for (artist of artists; track artist.id) {
            <p class="artist">
                {{ artist.name }}
            </p>
        }
    </section>
</main>
