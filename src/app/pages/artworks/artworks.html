<main class="artworks">
    <header class="artworks__header">
        <app-search [searchTerm]="searchText" (searchChange)="onSearch($event)"/>
    </header>
    <section class="artworks__content">
        @for (artwork of artworks; track artwork.id) {
            <p class="artwork">
                {{ artwork.title }}
                <span class="artwork__year">
                    ( {{ artwork.year }} )
                </span>
            </p>
        }
    </section>
</main>
